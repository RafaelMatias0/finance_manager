    </main>

<div id="modal-form-plano" class="modal oculto" role="dialog" aria-modal="true" aria-labelledby="titulo-modal-plano">
  <div class="modal__conteudo">
    <h2 class="painel__titulo" id="titulo-modal-plano">Novo plano</h2>
    <form id="form-plano" class="formulario">
      <p class="erro-formulario" id="erro-plano" role="alert"></p>
      <input type="hidden" name="id" />

      <label class="campo">
        <span>Nome</span>
        <input type="text" name="nome" required maxlength="120" placeholder="Ex: Reserva de emergência" />
      </label>

      <div class="campo-grupo-tipo" role="radiogroup" aria-label="Tipo de plano" id="grupo-tipo-plano">
        <label class="opcao-tipo">
          <input type="radio" name="tipo" value="guardar_dinheiro" checked />
          <span>Guardar dinheiro</span>
        </label>
        <label class="opcao-tipo">
          <input type="radio" name="tipo" value="quitar_divida" />
          <span>Quitar dívida</span>
        </label>
      </div>

      <label class="campo">
        <span>Conta</span>
        <select name="conta_id" id="select-conta-plano" required></select>
      </label>

      <label class="campo">
        <span>Mês de início</span>
        <input type="month" name="mes_inicio" required />
      </label>

      <div class="campo-grupo-tipo" role="radiogroup" aria-label="Como guardar" id="grupo-guardar-modo">
        <label class="opcao-tipo">
          <input type="radio" name="guardar_modo" value="simples" checked />
          <span>Meta simples</span>
        </label>
        <label class="opcao-tipo">
          <input type="radio" name="guardar_modo" value="reducao_categoria" />
          <span>Reduzir categoria</span>
        </label>
      </div>

      <div class="campo-grupo-tipo oculto" role="radiogroup" aria-label="Como quitar" id="grupo-divida-modo">
        <label class="opcao-tipo">
          <input type="radio" name="divida_modo" value="prazo" checked />
          <span>Prazo livre</span>
        </label>
        <label class="opcao-tipo">
          <input type="radio" name="divida_modo" value="parcelas" />
          <span>Parcelas</span>
        </label>
      </div>

      <label class="campo oculto" id="campo-categoria-plano">
        <span id="rotulo-categoria-plano">Categoria</span>
        <select name="categoria_id" id="select-categoria-plano"></select>
      </label>

      <div class="campo-grupo-tipo oculto" role="radiogroup" aria-label="Critério de redução" id="grupo-criterio-reducao">
        <label class="opcao-tipo">
          <input type="radio" name="criterio_reducao" value="percentual_receita" checked />
          <span>% da receita</span>
        </label>
        <label class="opcao-tipo">
          <input type="radio" name="criterio_reducao" value="valor_fixo" />
          <span>Valor fixo vs. média</span>
        </label>
      </div>

      <label class="campo oculto" id="campo-alvo-percentual">
        <span>Gastar no máximo (% da receita do mês)</span>
        <input type="number" name="alvo_percentual" step="0.01" min="0.01" max="100" />
      </label>

      <label class="campo oculto" id="campo-alvo-valor-reducao">
        <span>Reduzir (R$) vs. média dos últimos 3 meses</span>
        <input type="number" name="alvo_valor_reducao" step="0.01" min="0.01" />
      </label>

      <label class="campo oculto" id="campo-valor-alvo">
        <span id="rotulo-valor-alvo">Valor alvo</span>
        <input type="number" name="valor_alvo" step="0.01" min="0.01" />
      </label>

      <label class="campo oculto" id="campo-data-prazo">
        <span>Prazo (data-alvo)</span>
        <input type="date" name="data_prazo" />
      </label>

      <label class="campo oculto" id="campo-numero-parcelas">
        <span>Número de parcelas</span>
        <input type="number" name="numero_parcelas" min="1" max="600" />
      </label>

      <label class="campo oculto" id="campo-dia-vencimento-plano">
        <span>Dia do vencimento (todo mês)</span>
        <input type="number" name="dia_vencimento" min="1" max="31" />
      </label>

      <div class="modal__acoes">
        <button type="button" id="btn-cancelar-plano" class="btn btn--fantasma">Cancelar</button>
        <button type="submit" class="btn btn--principal">Salvar</button>
      </div>
    </form>
  </div>
</div>

<div id="modal-pagamento-plano" class="modal oculto" role="dialog" aria-modal="true" aria-labelledby="titulo-modal-pagamento-plano">
  <div class="modal__conteudo">
    <h2 class="painel__titulo" id="titulo-modal-pagamento-plano">Registrar pagamento</h2>
    <form id="form-pagamento-plano" class="formulario">
      <p class="erro-formulario" id="erro-pagamento-plano" role="alert"></p>

      <label class="campo">
        <span>Valor</span>
        <input type="number" name="valor" step="0.01" min="0.01" required />
      </label>

      <label class="campo">
        <span>Data</span>
        <input type="date" name="data" required />
      </label>

      <label class="campo">
        <span>Descrição (opcional)</span>
        <input type="text" name="descricao" maxlength="255" />
      </label>

      <div class="modal__acoes">
        <button type="button" id="btn-cancelar-pagamento-plano" class="btn btn--fantasma">Cancelar</button>
        <button type="submit" class="btn btn--principal">Confirmar</button>
      </div>
    </form>
  </div>
</div>

<div id="regiao-toast" class="regiao-toast" aria-live="polite"></div>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>

</html>
