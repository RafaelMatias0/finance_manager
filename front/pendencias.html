        <span class="sidebar__selo">C</span>
        <span class="sidebar__nome">Cofre</span>
      </div>
    </div>

    <nav class="sidebar__nav">
      <a href="index.html" class="sidebar__link" data-pagina="inicio">
        <span class="sidebar__icone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg></span>
        <span class="sidebar__label">Início</span>
      </a>
      <a href="controle.html" class="sidebar__link" data-pagina="controle">
        <span class="sidebar__icone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><circle cx="9" cy="6" r="2"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="15" cy="12" r="2"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="7" cy="18" r="2"/></svg></span>
        <span class="sidebar__label">Controle</span>

      <a href="relatorios.html" class="sidebar__link" data-pagina="relatorios">
        <span class="sidebar__icone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="20" x2="4" y2="12"/><line x1="12" y1="20" x2="12" y2="6"/><line x1="20" y1="20" x2="20" y2="14"/></svg></span>
        <span class="sidebar__label">Relatórios</span>
      </a>
      <a href="contas.html" class="sidebar__link" data-pagina="contas">
        <span class="sidebar__icone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><circle cx="16" cy="14" r="1"/></svg></span>
        <span class="sidebar__label">Contas</span>

      <a href="pendencias.html" class="sidebar__link" data-pagina="pendencias">
        <span class="sidebar__icone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></span>

    <div class="sidebar__rodape">
      <button id="btn-sair-sidebar" class="btn btn--fantasma btn--pequeno"><span class="rotulo-completo">Sair</span></button>

  <div class="app-shell__conteudo">
    <header class="topo"></header>

    <main class="tela-app">

      <section class="painel" aria-label="Pendências">
        <div class="painel__cabecalho">
          <h2 class="painel__titulo">Pendências</h2>
          <button type="button" id="btn-nova-pendencia" class="link-acao">+ nova pendência</button>
        </div>
        <div id="lista-pendencias" class="lista-pendencias"></div>
        <p id="pendencias-vazio" class="estado-vazio oculto">Nenhuma pendência cadastrada ainda.</p>
      </section>

    </main>
  </div>
</div>

<div id="modal-form-pendencia" class="modal oculto" role="dialog" aria-modal="true" aria-labelledby="titulo-modal-pendencia">
  <div class="modal__conteudo">
    <h2 class="painel__titulo" id="titulo-modal-pendencia">Nova pendência</h2>
    <form id="form-pendencia" class="formulario">
      <p class="erro-formulario" id="erro-pendencia" role="alert"></p>
      <input type="hidden" name="id" />

      <div class="campo-grupo-tipo" role="radiogroup" aria-label="Tipo">
        <label class="opcao-tipo">
          <input type="radio" name="tipo" value="receita" />
          <span>Receita</span>
        </label>
        <label class="opcao-tipo">
          <input type="radio" name="tipo" value="despesa" checked />
          <span>Despesa</span>
        </label>
      </div>

      <label class="campo">
        <span>Descrição</span>
        <input type="text" name="descricao" required maxlength="120" placeholder="Ex: Aluguel" />
      </label>

      <label class="campo">
        <span>Valor</span>
        <input type="number" name="valor" step="0.01" min="0.01" required placeholder="0,00" />
      </label>

      <label class="campo">
        <span>Categoria</span>
        <select name="categoria_id" id="select-categoria-pendencia" required></select>
      </label>

      <label class="campo">
        <span>Conta padrão (opcional)</span>
        <select name="conta_id" id="select-conta-pendencia">
          <option value="">Nenhuma</option>
        </select>
      </label>

      <div class="campo-grupo-tipo" role="radiogroup" aria-label="Recorrência">
        <label class="opcao-tipo">
          <input type="radio" name="recorrente" value="nao" checked />
          <span>Avulsa</span>
        </label>
        <label class="opcao-tipo">
          <input type="radio" name="recorrente" value="sim" />
          <span>Recorrente (mensal)</span>
        </label>
      </div>

      <label class="campo" id="campo-data-vencimento">
        <span>Data de vencimento</span>
        <input type="date" name="data_vencimento" />
      </label>

      <label class="campo oculto" id="campo-dia-vencimento">
        <span>Dia do vencimento (todo mês)</span>
        <input type="number" name="dia_vencimento" min="1" max="31" placeholder="Ex: 5" />
      </label>

      <div class="modal__acoes">
        <button type="button" id="btn-cancelar-pendencia" class="btn btn--fantasma">Cancelar</button>
        <button type="submit" class="btn btn--principal">Salvar</button>
      </div>
    </form>
  </div>
</div>

<div id="modal-pagar-pendencia" class="modal oculto" role="dialog" aria-modal="true" aria-labelledby="titulo-modal-pagar">
  <div class="modal__conteudo">
    <h2 class="painel__titulo" id="titulo-modal-pagar">Marcar como paga</h2>
    <form id="form-pagar-pendencia" class="formulario">
      <p class="erro-formulario" id="erro-pagar-pendencia" role="alert"></p>
      <input type="hidden" name="data_vencimento" />

      <label class="campo">
        <span>Conta</span>
        <select name="conta_id" id="select-conta-pagamento" required></select>
      </label>

      <label class="campo">
        <span>Valor pago</span>
        <input type="number" name="valor" step="0.01" min="0.01" required />
      </label>

      <label class="campo">
        <span>Data do pagamento</span>
        <input type="date" name="data" required />
      </label>

      <label class="campo">
        <span>Descrição (opcional)</span>
        <input type="text" name="descricao" maxlength="255" />
      </label>

      <div class="modal__acoes">
        <button type="button" id="btn-cancelar-pagar-pendencia" class="btn btn--fantasma">Cancelar</button>
        <button type="submit" class="btn btn--principal">Confirmar pagamento</button>
      </div>
    </form>
  </div>
</div>

<div id="regiao-toast" class="regiao-toast" aria-live="polite"></div>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/pendencias.js"></script>
<script src="js/sidebar.js"></script>
</body>
</html>
