<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script>
  // Escuro é o padrão do site. Só fica claro se o usuário escolheu
  // explicitamente "claro" antes (ver js/tema.js). Roda antes da
  // primeira pintura pra não piscar claro e depois escurecer.
  (function () {
    try {
      if (localStorage.getItem("gf_tema") !== "claro") {
        document.documentElement.setAttribute("data-tema", "escuro");
      }
    } catch (erro) {
      document.documentElement.setAttribute("data-tema", "escuro");
    }
  })();
</script>
<title>Pendências — Cofre</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

</head>

        <span class="sidebar__label">Relatórios</span>
      </a>
      <a href="contas.html" class="sidebar__link" data-pagina="contas">
        <span class="sidebar__icone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><circle cx="16" cy="14" r="1"/></svg></span>
        <span class="sidebar__label">Contas</span>
      </a>
      <a href="pendencias.html" class="sidebar__link" data-pagina="pendencias">
        <span class="sidebar__icone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></span>

      <a href="planos.html" class="sidebar__link" data-pagina="planos">
        <span class="sidebar__icone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg></span>
        <span class="sidebar__label">Planos e Metas</span>

  <div class="app-shell__conteudo">
    <header class="topo">
      <div>
        <h1 class="topo__titulo">Pendências</h1>
        <p class="topo__subtitulo">Contas recorrentes e avulsas, em dia ou atrasadas.</p>
      </div>
      <div class="topo__acoes">
        <button type="button" id="btn-alternar-tema" class="btn-icone-tema" aria-label="Alternar tema claro/escuro">
          <span class="icone-tema icone-tema--lua"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></span>

            <span class="menu-usuario__nome" id="menu-usuario-nome">Carregando…</span>
            <svg class="menu-usuario__seta" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>

              <span class="menu-usuario__item-icone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg></span>

    <main class="tela-app">

      <section class="painel" aria-label="Pendências">
        <div class="painel__cabecalho">
          <h2 class="painel__titulo">Pendências</h2>
          <button type="button" id="btn-nova-pendencia" class="link-acao">+ nova pendência</button>
        </div>
        <div id="lista-pendencias" class="lista-pendencias"></div>

<div id="modal-form-pendencia" class="modal oculto" role="dialog" aria-modal="true" aria-labelledby="titulo-modal-pendencia">
  <div class="modal__conteudo">
    <h2 class="painel__titulo" id="titulo-modal-pendencia">Nova pendência</h2>
    <form id="form-pendencia" class="formulario">
      <p class="erro-formulario" id="erro-pendencia" role="alert"></p>
      <input type="hidden" name="id" />

      <div class="campo-grupo-tipo" role="radiogroup" aria-label="Tipo">
        <label class="opcao-tipo">
          <input type="radio" name="tipo" value="receita" />
          <span>Receita</span>
        </label>
        <label class="opcao-tipo">
          <input type="radio" name="tipo" value="despesa" checked />
          <span>Despesa</span>
        </label>
      </div>

      <label class="campo">
        <span>Descrição</span>
        <input type="text" name="descricao" required maxlength="120" placeholder="Ex: Aluguel" />
      </label>

      <label class="campo">
        <span>Valor</span>
        <input type="number" name="valor" step="0.01" min="0.01" required placeholder="0,00" />
      </label>

      <label class="campo">
        <span>Categoria</span>
        <select name="categoria_id" id="select-categoria-pendencia" required></select>
      </label>

      <label class="campo">
        <span>Conta padrão (opcional)</span>
        <select name="conta_id" id="select-conta-pendencia">
          <option value="">Nenhuma</option>
        </select>
      </label>

      <div class="campo-grupo-tipo" role="radiogroup" aria-label="Recorrência">
        <label class="opcao-tipo">
          <input type="radio" name="recorrente" value="nao" checked />
          <span>Avulsa</span>
        </label>
        <label class="opcao-tipo">
          <input type="radio" name="recorrente" value="sim" />
          <span>Recorrente (mensal)</span>
        </label>
      </div>

      <label class="campo" id="campo-data-vencimento">
        <span>Data de vencimento</span>
        <input type="date" name="data_vencimento" />
      </label>

      <label class="campo oculto" id="campo-dia-vencimento">
        <span>Dia do vencimento (todo mês)</span>
        <input type="number" name="dia_vencimento" min="1" max="31" placeholder="Ex: 5" />
      </label>

      <div class="modal__acoes">
        <button type="button" id="btn-cancelar-pendencia" class="btn btn--fantasma">Cancelar</button>
        <button type="submit" class="btn btn--principal">Salvar</button>
      </div>
    </form>
  </div>
</div>

<div id="modal-pagar-pendencia" class="modal oculto" role="dialog" aria-modal="true" aria-labelledby="titulo-modal-pagar">
  <div class="modal__conteudo">
    <h2 class="painel__titulo" id="titulo-modal-pagar">Marcar como paga</h2>
    <form id="form-pagar-pendencia" class="formulario">
      <p class="erro-formulario" id="erro-pagar-pendencia" role="alert"></p>
      <input type="hidden" name="data_vencimento" />

      <label class="campo">
        <span>Conta</span>
        <select name="conta_id" id="select-conta-pagamento" required></select>
      </label>

      <label class="campo">
        <span>Valor pago</span>
        <input type="number" name="valor" step="0.01" min="0.01" required />
      </label>

      <label class="campo">
        <span>Data do pagamento</span>
        <input type="date" name="data" required />
      </label>

      <label class="campo">
        <span>Descrição (opcional)</span>
        <input type="text" name="descricao" maxlength="255" />
      </label>

      <div class="modal__acoes">
        <button type="button" id="btn-cancelar-pagar-pendencia" class="btn btn--fantasma">Cancelar</button>
        <button type="submit" class="btn btn--principal">Confirmar pagamento</button>
      </div>
    </form>
  </div>
</div>

<div id="modal-perfil" class="modal oculto" role="dialog" aria-modal="true" aria-labelledby="titulo-modal-perfil">
  <div class="modal__conteudo">
    <h2 class="painel__titulo" id="titulo-modal-perfil">Perfil</h2>
    <form id="form-perfil" class="formulario">
      <p class="erro-formulario" id="erro-perfil" role="alert"></p>
      <label class="campo">
        <span>Nome</span>
        <input type="text" name="nome" required minlength="1" maxlength="120" />
      </label>
      <div class="campo">
        <span>Email</span>
        <div class="campo-somente-leitura" id="texto-email-perfil"></div>
      </div>
      <div class="modal__acoes">
        <button type="button" id="btn-cancelar-perfil" class="btn btn--fantasma">Cancelar</button>
        <button type="submit" class="btn btn--principal">Salvar</button>
      </div>
    </form>
  </div>
</div>

<div id="modal-confirmar" class="modal oculto" role="alertdialog" aria-modal="true" aria-labelledby="confirmar-mensagem">
  <div class="modal__conteudo modal__conteudo--confirmar">
    <p id="confirmar-mensagem" class="confirmar__mensagem"></p>
    <div class="modal__acoes">
      <button type="button" id="btn-confirmar-nao" class="btn btn--fantasma">Cancelar</button>
      <button type="button" id="btn-confirmar-sim" class="btn btn--perigo">Apagar</button>
    </div>
  </div>
</div>

<div id="regiao-toast" class="regiao-toast" aria-live="polite"></div>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/tema.js"></script>
<script src="js/api.js"></script>
<script src="js/confirmar.js"></script>
<script src="js/pendencias.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/usuario.js"></script>
</body>
</html>
