<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cofre — controle financeiro pessoal</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body data-pagina="inicio">

<header class="topo" id="topo-publico">
  <div class="topo__marca">
    <span class="topo__selo">C</span>
    <span class="topo__nome">Cofre</span>
  </div>
</header>

<main id="tela-auth" class="tela-auth">
  <div class="cartao-auth">
    <div class="cartao-auth__abas" role="tablist">
      <button class="aba is-ativa" data-aba="login" role="tab" aria-selected="true">Entrar</button>
      <button class="aba" data-aba="cadastro" role="tab" aria-selected="false">Criar conta</button>
    </div>

    <form id="form-login" class="formulario" data-painel="login">
      <p class="erro-formulario" id="erro-login" role="alert"></p>
      <label class="campo">
        <span>Email</span>
        <input type="email" name="email" required autocomplete="email" />
      </label>
      <label class="campo">
        <span>Senha</span>
        <input type="password" name="senha" required autocomplete="current-password" />
      </label>
      <button type="submit" class="btn btn--principal">Entrar</button>
    </form>

    <form id="form-cadastro" class="formulario oculto" data-painel="cadastro">
      <p class="erro-formulario" id="erro-cadastro" role="alert"></p>
      <label class="campo">
        <span>Nome</span>
        <input type="text" name="nome" required autocomplete="name" />
      </label>
      <label class="campo">
        <span>Email</span>
        <input type="email" name="email" required autocomplete="email" />
      </label>
      <label class="campo">
        <span>Senha</span>
        <input type="password" name="senha" required minlength="6" autocomplete="new-password" />
      </label>
      <button type="submit" class="btn btn--principal">Criar conta</button>
    </form>
  </div>
</main>

<div id="app-shell" class="app-shell oculto">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar__topo">
      <button type="button" class="sidebar__toggle" data-acao="toggle-sidebar" aria-label="Recolher/expandir menu">☰</button>
      <div class="sidebar__marca">
        <span class="sidebar__selo">C</span>
        <span class="sidebar__nome">Cofre</span>
      </div>
    </div>

    <nav class="sidebar__nav">
      <a href="index.html" class="sidebar__link" data-pagina="inicio">
        <span class="sidebar__icone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg></span>
        <span class="sidebar__label">Início</span>
      </a>
      <a href="controle.html" class="sidebar__link" data-pagina="controle">
        <span class="sidebar__icone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><circle cx="9" cy="6" r="2"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="15" cy="12" r="2"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="7" cy="18" r="2"/></svg></span>
        <span class="sidebar__label">Controle</span>
      </a>
      <a href="relatorios.html" class="sidebar__link" data-pagina="relatorios">
        <span class="sidebar__icone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="20" x2="4" y2="12"/><line x1="12" y1="20" x2="12" y2="6"/><line x1="20" y1="20" x2="20" y2="14"/></svg></span>
        <span class="sidebar__label">Relatórios</span>
      </a>
      <a href="contas.html" class="sidebar__link" data-pagina="contas">
        <span class="sidebar__icone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><circle cx="16" cy="14" r="1"/></svg></span>
        <span class="sidebar__label">Contas</span>
      </a>
      <a href="pendencias.html" class="sidebar__link" data-pagina="pendencias">
        <span class="sidebar__icone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></span>
        <span class="sidebar__label">Pendências</span>
      </a>
      <span class="sidebar__link sidebar__link--desabilitado" title="Em breve">
        <span class="sidebar__icone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg></span>
        <span class="sidebar__label">Planos e Metas</span>
        <span class="sidebar__selo-em-breve">em breve</span>
      </span>
    </nav>

    <div class="sidebar__rodape">
      <button id="btn-sair-sidebar" class="btn btn--fantasma btn--pequeno"><span class="rotulo-completo">Sair</span></button>
    </div>
  </aside>

  <div class="app-shell__conteudo">
    <header class="topo"></header>

    <main id="tela-app" class="tela-app">

      <div class="grid-inicio">

        <div class="grid-inicio__linha">
          <section class="painel" aria-label="Pendências">
            <div class="painel__cabecalho">
              <h2 class="painel__titulo">Pendências</h2>
            </div>
            <div id="resumo-pendencias" class="resumo-pendencias-inicio"></div>
            <p id="resumo-pendencias-vazio" class="estado-vazio oculto">Nenhuma pendência no momento.</p>
            <a href="pendencias.html" class="link-acao">Gerenciar pendências →</a>
          </section>

          <section class="painel" aria-label="Saldo por conta">
            <div class="painel__cabecalho">
              <h2 class="painel__titulo">Contas</h2>
            </div>
            <div id="resumo-contas" class="resumo-contas-inicio"></div>
            <p id="resumo-contas-vazio" class="estado-vazio oculto">Nenhuma conta cadastrada.</p>
            <a href="contas.html" class="link-acao">Gerenciar contas →</a>
          </section>
        </div>

        <div class="grid-inicio__linha grid-inicio__linha--form">
          <section class="painel painel--form" aria-label="Nova movimentação">
            <h2 class="painel__titulo">Nova movimentação</h2>
            <form id="form-movimentacao" class="formulario">
              <p class="erro-formulario" id="erro-movimentacao" role="alert"></p>

              <div class="campo-grupo-tipo" role="radiogroup" aria-label="Tipo">
                <label class="opcao-tipo">
                  <input type="radio" name="tipo" value="receita" checked />
                  <span>Receita</span>
                </label>
                <label class="opcao-tipo">
                  <input type="radio" name="tipo" value="despesa" />
                  <span>Despesa</span>
                </label>
              </div>

              <label class="campo">
                <span>Valor</span>
                <input type="number" name="valor" step="0.01" min="0.01" required placeholder="0,00" />
              </label>

              <label class="campo">
                <span>Categoria</span>
                <select name="categoria_id" id="select-categoria" required></select>
              </label>

              <button type="button" id="btn-toggle-nova-categoria" class="link-acao">+ nova categoria</button>

              <div id="bloco-nova-categoria" class="bloco-nova-categoria oculto">
                <label class="campo">
                  <span>Nome da categoria</span>
                  <input type="text" id="input-nome-categoria" maxlength="80" placeholder="Ex: Freelas" />
                </label>
                <button type="button" id="btn-salvar-categoria" class="btn btn--secundario btn--pequeno">Salvar categoria</button>
              </div>

              <label class="campo">
                <span>Conta</span>
                <select name="conta_id" id="select-conta" required></select>
              </label>

              <label class="campo">
                <span>Descrição</span>
                <input type="text" name="descricao" maxlength="255" placeholder="Opcional" />
              </label>

              <label class="campo">
                <span>Data</span>
                <input type="date" name="data" required />
              </label>

              <button type="submit" class="btn btn--principal">Adicionar</button>
            </form>
          </section>

          <section class="cartao-em-breve" aria-label="Enviar arquivo (em breve)">
            <div class="cartao-em-breve__cabecalho">
              <span class="cartao-em-breve__icone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="M6 10l6-6 6 6"/><path d="M4 20h16"/></svg></span>
              <h2 class="painel__titulo cartao-em-breve__titulo">Enviar arquivo</h2>
              <span class="selo-em-breve">em breve</span>
            </div>
            <p class="cartao-em-breve__descricao">Importação de extratos e comprovantes.</p>
          </section>
        </div>

      </div>
    </main>
  </div>
</div>

<div id="regiao-toast" class="regiao-toast" aria-live="polite"></div>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/sidebar.js"></script>
</body>
</html>
